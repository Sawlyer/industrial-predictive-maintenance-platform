[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "industrial-predictive-maintenance-platform"
version = "0.1.0"
description = "Remaining Useful Life prediction and failure-risk scoring for a turbofan engine fleet."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "plotly>=5.20",
    "streamlit>=1.33",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "ipykernel>=6.29",
    "kaleido>=0.2.1",
]

[project.scripts]
predmaint = "predmaint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/predmaint"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["predmaint", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]
filterwarnings = [
    "ignore::DeprecationWarning:joblib.*",
    "ignore::DeprecationWarning:starlette.*",
]
