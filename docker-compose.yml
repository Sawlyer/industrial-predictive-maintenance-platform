services:
  dashboard:
    build: .
    image: predmaint:latest
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports

  api:
    image: predmaint:latest
    depends_on:
      - dashboard
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, sys, urllib.request;
          payload = json.load(urllib.request.urlopen('http://localhost:8000/health'));
          sys.exit(0 if payload.get('status') == 'ok' and payload.get('model_loaded') else 1)
      interval: 10s
      timeout: 5s
      retries: 5
